spring:
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE}?currentSchema=${POSTGRESQL_SCHEMA:constructor}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASS}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    show-sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

jwt:
  expired: ${JWT_EXPIRED_MINUTES:30}
  refresh-expired-days: ${JWT_REFRESH_EXPIRED_DAYS:7}
  issuer: ${JWT_ISSUER:constructor-prod}
  cookie-secure: true
  rsa-public-key: ${JWT_PUBLIC_KEY}
  rsa-private-key: ${JWT_PRIVATE_KEY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  admin:
    username: ${ADMIN_INITIAL_USERNAME:}
    password: ${ADMIN_INITIAL_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    ROOT: WARN
    org.hibernate.SQL: WARN
    com.backend.constructor: INFO
