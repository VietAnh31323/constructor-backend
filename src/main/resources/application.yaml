server:
  port: ${SERVER_PORT:8078}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: constructor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  messages:
    encoding: UTF-8
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yaml
    default-schema: ${POSTGRESQL_SCHEMA:constructor}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    generate-ddl: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:15}
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
    ip-window-minutes: ${LOGIN_IP_WINDOW_MINUTES:5}

openapi:
  service:
    api-docs: api-service
    title: ${API_TITLE:Constructor Backend API}
    server: ${API_URL:http://localhost:8078}
    version: 1.0.0
