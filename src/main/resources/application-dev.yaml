spring:
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST:localhost}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE:postgres}?currentSchema=${POSTGRESQL_SCHEMA:constructor}
    username: ${POSTGRESQL_USER:root}
    password: ${POSTGRESQL_PASS:root}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

jwt:
  expired: ${JWT_EXPIRED_MINUTES:1440}
  refresh-expired-days: ${JWT_REFRESH_EXPIRED_DAYS:15}
  issuer: ${JWT_ISSUER:constructor-dev}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  rsa-public-key: ${JWT_PUBLIC_KEY:}
  rsa-private-key: ${JWT_PRIVATE_KEY:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  admin:
    username: ${ADMIN_INITIAL_USERNAME:admin@gmail.com}
    password: ${ADMIN_INITIAL_PASSWORD:admin}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: INFO
    com.backend.constructor: DEBUG
